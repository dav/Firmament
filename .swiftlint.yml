parent_config: ../ProjectTemplates/apple-release/swiftlint-base.yml

# Replaces the shared list rather than adding to it, so the common entries are
# repeated here. See the comment in swiftlint-base.yml.
excluded:
  - build
  - DerivedData
  - "**/.build"
  - tmp
  - FirmamentCore/.build
  - Firmament.xcodeproj

identifier_name:
  excluded:
    - id
    - x
    - y
    - z
    - i
    - j
    - k
    - up
    - ts
    - t
    - to
